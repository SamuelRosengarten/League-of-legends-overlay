<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LoL Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header>LoL Overlay <span id="clock" class="muted"></span></header>
    <p id="status" class="muted">Waiting for a game to start...</p>
    <section id="game" hidden>
      <p><b id="champ"></b> &middot; level <span id="level"></span> &middot; <span id="gold"></span> gold</p>
      <p id="items" class="muted"></p>
    </section>
    <div id="guide"></div>
    <p class="muted">Hide/show: <kbd>Ctrl+Shift+O</kbd></p>
  </main>
  <script src="data/guides.js"></script>
  <script src="guide.js"></script>
  <script src="main.js"></script>
</body>
</html>
