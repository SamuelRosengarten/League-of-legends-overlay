<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LoL Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header>LoL Overlay <span id="clock" class="muted"></span></header>
    <section id="waiting">
      <p>Waiting for a game to start...</p>
      <p class="muted">Press <kbd>Ctrl+Shift+O</kbd> to show or hide. League must be in Borderless or Windowed mode.</p>
    </section>
    <section id="game" hidden>
      <p><b id="champ"></b> &middot; level <span id="level"></span> &middot; <span id="gold"></span> gold</p>
      <ul id="items"></ul>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
