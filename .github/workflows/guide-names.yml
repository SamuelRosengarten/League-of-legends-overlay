name: Guide names
# Riot renames items and runes between patches. This runs weekly (not on pull requests, so a
# Riot outage or rename never blocks unrelated work) and fails if a guide names something
# that no longer exists in Data Dragon.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  check-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:names
