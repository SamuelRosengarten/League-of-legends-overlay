name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Guide data tests
        run: npm run test:guides
      - name: UI tests (Chromium, mocked game + Data Dragon)
        run: CHROME_PATH="$(which google-chrome)" npm run test:ui

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lol-overlay-windows
          path: |
            src-tauri/target/release/lol-overlay.exe
            src-tauri/target/release/bundle/nsis/*.exe
